# Ограничение числа процессов Apache (mpm_prefork) для сервера с 2 ГБ RAM.
# Монтируется в conf-enabled/: подключается после mods-enabled/ и переопределяет значения по умолчанию
# (там MaxRequestWorkers 150).
<IfModule mpm_prefork_module>
	StartServers             2
	MinSpareServers          2
	MaxSpareServers          4
	MaxRequestWorkers        8
	MaxConnectionsPerChild   500
</IfModule>
