# Вики IT-отдела: nginx на хосте проксирует на контейнер MediaWiki (127.0.0.1:8080).
# Устанавливается в /etc/nginx/sites-available/wiki.inbicst.ru (см. README, раздел «Деплой»).
# Сертификат выпущен certbot (--nginx) и продлевается certbot.timer; пути к нему не менять.

server {
    listen 443 ssl;
    server_name wiki.inbicst.ru;

    ssl_certificate /etc/letsencrypt/live/wiki.inbicst.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wiki.inbicst.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Чуть больше лимита PHP (php/uploads.ini: 20M)
    client_max_body_size 25M;

    # MediaWiki ставит nosniff только на страницы; нужен и для картинок/загрузок.
    proxy_hide_header X-Content-Type-Options;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name wiki.inbicst.ru;
    return 301 https://$host$request_uri;
}
